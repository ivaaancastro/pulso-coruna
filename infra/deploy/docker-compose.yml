# Producción mínima de Pulso A Coruña (M3.6). Desde la raíz del repo:
#   cp infra/deploy/.env.example infra/deploy/.env   # y rellénalo
#   docker compose -f infra/deploy/docker-compose.yml up -d --build
# Guía completa: docs/deploy.md
name: pulso

services:
  db:
    image: timescale/timescaledb:2.32.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulso
      POSTGRES_DB: pulso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en infra/deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    # Sin `ports:`: solo accesible desde la red interna de compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pulso -d pulso"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  ingest:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.ingest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://pulso:${POSTGRES_PASSWORD}@db:5432/pulso
    # Logs rotados para no llenar el disco del VPS.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backup:
    image: timescale/timescaledb:2.32.0-pg17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: db
      PGUSER: pulso
      PGDATABASE: pulso
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - ${TILES_DIR:-./tiles}:/srv/tiles:ro
      - caddy_data:/data # certificados: no perderlo (límites de Let's Encrypt)
      - caddy_config:/config

  # API (M4): descomentar junto al bloque `handle /api/*` del Caddyfile.
  # api:
  #   build: ...
  #   restart: unless-stopped
  #   depends_on: { db: { condition: service_healthy } }
  #   environment:
  #     DATABASE_URL: postgres://pulso:${POSTGRES_PASSWORD}@db:5432/pulso

volumes:
  pgdata:
  caddy_data:
  caddy_config:
