name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Solo develop puede abrir PR hacia main (flujo de release).
  branch-policy:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Las PR hacia main solo pueden venir de develop (origen: ${{ github.head_ref }})"
            exit 1
          fi

  branch-name:
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - run: |
          if ! echo "${{ github.head_ref }}" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci)/[A-Za-z0-9._-]+$'; then
            echo "::error::Nombre de rama inválido: ${{ github.head_ref }} (usa tipo/ID-slug)"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm format:check

  # Presupuestos de rendimiento (ADR 0011): bundle gzip, Lighthouse CI, fps y 0 terceros.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Usa el Chrome estable preinstalado en ubuntu-latest (sin descargar navegadores).
      - run: pnpm perf:bundle
      - run: pnpm perf:lighthouse
      - run: pnpm perf:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-reports
          path: |
            .lighthouseci
            test-results
          if-no-files-found: ignore
          retention-days: 7
